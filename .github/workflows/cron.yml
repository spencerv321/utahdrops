name: Utah Drops cron

# Hits the CRON_SECRET-guarded /api/cron/<job> endpoints on schedule.
# Replaces Vercel native cron (Hobby caps crons at 2/day). Schedules are UTC,
# mirroring the former vercel.json. No two schedules fire in the same minute,
# so github.event.schedule maps 1:1 to a job.

on:
  schedule:
    - cron: "15 13,23 * * *"   # allocated       — 2×/day
    - cron: "0 18 2 * *"       # xlsx            — monthly, 2nd at 18:00
    - cron: "0 7 * * *"        # percentiles     — nightly
    - cron: "5 * * * *"        # digest          — hourly at :05
  # NOTE: catalog and store-inventory are NOT here — they run natively in
  # catalog.yml / store-inventory.yml (too slow for a serverless function).
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run manually"
        required: true
        type: choice
        options: [allocated, xlsx, percentiles, digest]

concurrency:
  group: utahdrops-cron-${{ github.event.schedule || github.event.inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and run job
        env:
          BASE_URL: https://utahdrops.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          case "${{ github.event.schedule }}" in
            "15 13,23 * * *")  JOB=allocated ;;
            "0 18 2 * *")      JOB=xlsx ;;
            "0 7 * * *")       JOB=percentiles ;;
            "5 * * * *")       JOB=digest ;;
            *)                 JOB="${{ github.event.inputs.job }}" ;;
          esac
          if [ -z "$JOB" ]; then echo "::error::could not resolve job"; exit 1; fi
          echo "Running job: $JOB"
          code=$(curl -sS -m 300 -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/$JOB")
          echo "HTTP $code"
          cat /tmp/out.json || true
          echo
          [ "$code" = "200" ] || { echo "::error::$JOB failed with HTTP $code"; exit 1; }
