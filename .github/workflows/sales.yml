name: DABS sales import

# Imports DABS's monthly Sales Analysis reports (abs.utah.gov/vendors/
# sales-analysis) into sales_reports / monthly_sales. Runs natively in the
# Actions runner like catalog.yml. Weekly is plenty: DABS posts one report a
# month, and months already imported are skipped (the newest two are always
# re-checked in case DABS revises them).

on:
  schedule:
    - cron: "40 16 * * 1" # Mondays
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-download every month and re-import any that changed"
        required: false
        type: boolean
        default: false

concurrency:
  group: sales
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Import sales reports
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DABS_CONTACT_EMAIL: ${{ secrets.DABS_CONTACT_EMAIL }}
          SALES_REFRESH: ${{ github.event.inputs.refresh == 'true' && '1' || '' }}
          NODE_ENV: production
        run: pnpm exec tsx scripts/scrape.ts sales
