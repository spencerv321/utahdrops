name: Rarity assessment

# Recomputes the Utah Drops availability assessment (product_rarity) from
# sales, stock history, DABS drawings and allocated drops. Runs natively in the
# Actions runner (heavy SQL over the snapshot history), like catalog.yml.

on:
  schedule:
    - cron: "50 9 * * *" # daily
  workflow_dispatch:

concurrency:
  group: rarity
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Assess
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: pnpm exec tsx scripts/scrape.ts rarity
