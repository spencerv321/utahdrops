name: Store inventory scrape

# Runs the per-store scraper natively in the Actions runner (not via the Vercel
# endpoint) so it isn't bound by the 60s Hobby function limit. Each SKU costs
# two DABS requests at <=1 req/sec, so this is a long-running, budget-limited
# rotating pass — exactly what a serverless function can't do.

# Schedule and size (2026-09-24 review of 244 scheduled runs): GitHub never
# dropped a slot while the workflow was enabled, but starts runs ~2h late
# (median 110 min, p90 180, max 350), and in June–July 20 runs were killed at
# the 30-minute timeout. So: an off-peak minute (GitHub is busiest at :00),
# every 4h, 400 SKUs (~15 min at the 1.1 s DABS pacing), and a scrape time
# budget (STORE_TIME_BUDGET_MINUTES, 25) under a 40-minute job timeout that
# leaves room for the slowest single SKU (~5 min of retries) plus the digest.
# Capacity math: scripts/report.ts mode "freshness".
#
# 2026-09-25: on its first day the 4-hourly cron triggered only 2 of 4 slots
# (GitHub drops scheduled events under load; it never did on the old 6-hourly
# cron, but nothing guarantees it). So the trigger fires every 2h and the job
# keeps the ~4h cadence itself: scheduled runs skip when a successful run
# started < 3.5h ago (STORE_MIN_GAP_HOURS). Manual runs always go ahead.
on:
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "SKUs to scrape this run (overrides STORE_SCRAPE_BUDGET)"
        required: false
        default: "400"

concurrency:
  group: store-inventory
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Scrape per-store inventory
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DABS_CONTACT_EMAIL: ${{ secrets.DABS_CONTACT_EMAIL }}
          STORE_SCRAPE_BUDGET: ${{ github.event.inputs.budget || '400' }}
          STORE_TIME_BUDGET_MINUTES: "25"
          STORE_MIN_GAP_HOURS: ${{ github.event_name == 'schedule' && '3.5' || '0' }}
          NODE_ENV: production
        run: pnpm exec tsx scripts/scrape.ts store-inventory

      # Send alerts for this pass's events now, instead of waiting on the
      # hourly digest schedule (which GitHub often skips or delays).
      - name: Send digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -m 300 -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://utahdrops.com/api/cron/digest)
          echo "HTTP $code"
          cat /tmp/out.json || true
          echo
          [ "$code" = "200" ] || { echo "::error::digest failed with HTTP $code"; exit 1; }
