name: Store inventory scrape

# Runs the per-store scraper natively in the Actions runner (not via the Vercel
# endpoint) so it isn't bound by the 60s Hobby function limit. Each SKU costs
# two DABS requests at <=1 req/sec, so this is a long-running, budget-limited
# rotating pass — exactly what a serverless function can't do.

# Reliability and size (history: STATUS.md, 2026-09-24..26):
# - GitHub starts scheduled runs ~2h late and fires only some triggers on this
#   repo, so nothing here depends on any single trigger. The cron (every 2h)
#   and other workflows finishing are chances to start; a start skips when a
#   successful run began < 3.5h ago (STORE_MIN_GAP_HOURS, not for manual runs).
# - Each run's size follows the time since the last success: ~100 SKUs/hour,
#   100–1,500 SKUs (lib/jobs/store-capacity.ts runBudget), i.e. ~2,400 checks
#   a day at the 1.1 s DABS pacing however many starts GitHub delivers.
# - The scrape stops cleanly at STORE_TIME_BUDGET_MINUTES (70; 1,500 SKUs ≈ 58
#   min) under a 90-minute job timeout (slowest SKU ~5 min + digest).
on:
  schedule:
    - cron: "37 */2 * * *"
  # GitHub fires only some scheduled triggers here (Sep 24–26: hourly cron ~⅓,
  # 3-hourly ~½, 2-hourly store 3 of ~7; the 3×/day catalog 6 of 6). Other
  # workflows finishing are extra chances to start; the skip guard keeps
  # those cheap, and each run's size follows the time since the last success.
  workflow_run:
    workflows: ["Catalog scrape", "Health check", "Utah Drops cron"]
    types: [completed]
  workflow_dispatch:
    inputs:
      budget:
        description: "SKUs to scrape this run (blank = sized from time since the last run)"
        required: false
        default: ""

concurrency:
  group: store-inventory
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Scrape per-store inventory
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DABS_CONTACT_EMAIL: ${{ secrets.DABS_CONTACT_EMAIL }}
          STORE_SCRAPE_BUDGET: ${{ github.event.inputs.budget || '' }}
          STORE_TIME_BUDGET_MINUTES: "70"
          STORE_MIN_GAP_HOURS: ${{ github.event_name == 'workflow_dispatch' && '0' || '3.5' }}
          NODE_ENV: production
        run: pnpm exec tsx scripts/scrape.ts store-inventory

      # Send alerts for this pass's events now, instead of waiting on the
      # hourly digest schedule (which GitHub often skips or delays).
      - name: Send digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -m 300 -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://utahdrops.com/api/cron/digest)
          echo "HTTP $code"
          cat /tmp/out.json || true
          echo
          [ "$code" = "200" ] || { echo "::error::digest failed with HTTP $code"; exit 1; }
