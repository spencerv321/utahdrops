name: Photo pilot

# Throwaway prototype: search the web for product photos for a fixed sample
# and upload contact sheets for manual review. Writes nothing to the DB.
on:
  workflow_dispatch:
  push:
    branches: [claude/intelligent-rubin-cg2pfx]
    paths: [scripts/photo-pilot/**, .github/workflows/photo-pilot.yml]

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (isolated from the app's lockfile)
        working-directory: scripts/photo-pilot
        run: npm init -y >/dev/null && npm i cheerio sharp
      - name: Run pilot
        working-directory: scripts/photo-pilot
        run: node pilot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: photo-pilot
          path: scripts/photo-pilot/out
